refresh_rate: 30 seconds

appenders:
  stdout:
    kind: console
    encoder:
      pattern: "{d(%Y-%m-%d %H:%M:%S)} [{l}] {t} - {m}{n}"

  rolling_file:
    kind: rolling_file
    path: logs/app.log
    encoder:
      pattern: "{d(%Y-%m-%d %H:%M:%S)} [{l}] {t} - {m}{n}"

    policy:
      kind: compound

      trigger:
        kind: time
        interval: 1 day
        modulate: true

      roller:
        kind: fixed_window
        base: 1
        count: 7
        pattern: "logs/app.{}.log"

root:
  level: info
  appenders:
    - stdout
    - rolling_file